name: CI

on:
   push:
      branches:
         - master
   pull_request:
      branches:
         - master

concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   build-and-test:
      runs-on: self-hosted
      timeout-minutes: 15
      steps:
         - name: Checkout
           uses: actions/checkout@v6

         - name: Set up Go
           uses: actions/setup-go@v5
           with:
              go-version-file: go.mod
              cache: false

         - name: Verify dependencies
           run: go mod verify

         - name: Build CSS
           run: make css

         - name: Vet
           run: go vet ./...

         - name: Build
           run: go build -v ./...

         - name: Test
           run: go test -v ./...

         - name: golangci-lint
           uses: golangci/golangci-lint-action@v7
           continue-on-error: true
           with:
              version: latest
