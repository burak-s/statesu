name: Build & Deploy

on:
   workflow_run:
      workflows: [CI]
      branches: [master]
      types: [completed]

concurrency:
   group: deploy-master
   cancel-in-progress: false

permissions:
   contents: read

jobs:
   deploy:
      if: ${{ github.event.workflow_run.conclusion == 'success' }}
      runs-on: self-hosted
      timeout-minutes: 15

      steps:
         - name: Checkout
           uses: actions/checkout@v6
           with:
              ref: ${{ github.event.workflow_run.head_sha }}

         - name: Build & Restart
           run: docker compose -f /home/burak/statesu-deploy/docker-compose.yml --project-directory . up --build -d

         - name: Prune old images
           run: docker image prune -f
