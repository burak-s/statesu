[package]
name = "statesu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Statesu backend: a small headless Markdown CMS over HTTP with Axum, SQLite and UUIDv7."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
form_urlencoded = "1.2"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"
sha2 = "0.10"
hmac = "0.12"
http = "1"
# Pin upstream until a SQLx release supports the patched SQLite bindings (RUSTSEC-2026-0459).
sqlx = { git = "https://github.com/launchbadge/sqlx.git", rev = "987b8c5a74b6da8b71da6b5549925a7f6e59aac9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rust-embed = "8"
uuid = { version = "1", features = ["v7", "serde"] }
# Media pipeline: bounded decode/re-encode for the three accepted formats;
# EXIF orientation for phone-shot JPEGs. Both are pure Rust.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# EXIF parsing (orientation for phone-shot JPEGs); pure Rust. Library
# name: `exif`.
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
