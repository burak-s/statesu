[package]
name = "statesu"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Statesu backend: user statuses over HTTP with Axum, SQLite and UUIDv7."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
form_urlencoded = "1.2"
getrandom = "0.4"
jsonwebtoken = "9"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"
sha2 = "0.10"
hmac = "0.12"
http = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rust-embed = "8"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
