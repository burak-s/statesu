{{define "auth-form"}}
<div class="min-h-screen flex items-center justify-center px-4">
    <div id="auth-container" class="w-full max-w-sm">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
            <div class="text-center mb-6">
                <a href="/" class="text-2xl font-bold text-brand-500">Statesu</a>
                <h1 class="text-xl font-semibold text-gray-900 mt-4">{{.Title}}</h1>
            </div>
            <form hx-post="{{.Action}}" hx-target="#auth-container" hx-swap="outerHTML" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" value="{{.Email}}" required autofocus
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition text-sm"
                        placeholder="you@example.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required minlength="8"
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition text-sm"
                        placeholder="********">
                </div>
                {{if .Error}}<p class="text-red-500 text-sm bg-red-50 rounded-lg px-3 py-2">{{.Error}}</p>{{end}}
                <button type="submit"
                    class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium rounded-lg transition cursor-pointer">
                    {{.Title}}
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-5">{{.AltText}} <a href="{{.AltLink}}" class="text-brand-500 hover:text-brand-600 font-medium">{{.AltLinkText}}</a></p>
        </div>
    </div>
</div>
{{end}}
