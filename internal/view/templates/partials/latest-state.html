{{define "latest-state"}}
{{if .Found}}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
    <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center text-brand-600 font-semibold text-sm flex-shrink-0">
            {{.Initial}}
        </div>
        <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate">{{.Email}}</p>
            <p class="text-sm text-gray-700 mt-1 whitespace-pre-wrap break-words">{{.Text}}</p>
            <p class="text-xs text-gray-400 mt-2">{{.CreatedAt}}</p>
        </div>
    </div>
</div>
{{else}}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
    <div class="text-gray-300 mb-2">
        <svg class="w-10 h-10 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
    </div>
    <p class="text-gray-400 text-sm">No states yet. Be the first!</p>
</div>
{{end}}
{{end}}
