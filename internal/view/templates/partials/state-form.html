{{define "state-form"}}
<form hx-post="/state/new" hx-target="this" hx-swap="outerHTML" class="space-y-3">
    <textarea id="text" name="text" rows="3" maxlength="4096" required autofocus
        class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none transition resize-none text-sm"
        placeholder="What's on your mind?">{{.Text}}</textarea>
    <div class="flex items-center gap-2">
        <select id="ttl" name="ttl" required
            class="px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brand-400 focus:border-brand-400 outline-none text-sm bg-white">
            <option value="1h" {{if eq .TTL "1h"}}selected{{end}}>1 hour</option>
            <option value="24h" {{if eq .TTL "24h"}}selected{{end}}>1 day</option>
            <option value="168h" {{if eq .TTL "168h"}}selected{{end}}>7 days</option>
            <option value="720h" {{if eq .TTL "720h"}}selected{{end}}>30 days</option>
        </select>
        <button type="submit"
            class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium rounded-lg transition cursor-pointer flex-shrink-0">
            Post
        </button>
    </div>
    {{if .Error}}<p class="text-red-500 text-sm bg-red-50 rounded-lg px-3 py-2">{{.Error}}</p>{{end}}
</form>
{{end}}
